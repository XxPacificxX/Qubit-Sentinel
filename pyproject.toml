[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qailab"
version = "0.1.0"
description = "Qubit Sentinel: neural QEC decoding, circuit noise prediction, and post-quantum crypto scanning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Koppelmann" }]
keywords = ["quantum computing", "quantum error correction", "surface code", "machine learning",
            "post-quantum cryptography", "qiskit", "cbom"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "pymatching>=2.2",
    "torch",
    "qiskit>=1.0",
    "qiskit-aer",
    "qiskit-ibm-runtime",
]

[project.optional-dependencies]
stim = ["stim"]
llm = ["anthropic>=2.0"]
plot = ["matplotlib"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/XxPacificxX/Qubit-Sentinel"

[project.scripts]
qailab = "qailab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
